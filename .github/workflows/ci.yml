name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'agentconnect/rebase-*']

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Bundle binaries
        run: npm run bundle:all

  local-mcp:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Verify local Codex MCP approvals
        env:
          RUN_LOCAL_CODEX_TESTS: 'true'
          LOCAL_CODEX_BINARY: ${{ github.workspace }}/node_modules/.bin/codex
        run: npm exec -- vitest run src/__tests__/CodexACPAgent/e2e/acp-e2e-local-mcp-approval.test.ts --retry=0
